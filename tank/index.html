<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vintage Tank — 360° View</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  font-family: Arial, sans-serif;
  color: #222;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 5px 0 15px;
}

.viewer {
  position: relative;
  width: 100%;
  height: 650px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.viewer:active {
  cursor: grabbing;
}

.viewer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 28px;
  cursor: pointer;
  z-index: 2;
}

.arrow.left {
  left: 12px;
}

.arrow.right {
  right: 12px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 12px;
}

button.control {
  border: 1px solid #bbb;
  background: #fff;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}

.hint {
  text-align: center;
  color: #666;
  font-size: 13px;
  margin-top: 9px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>Vintage Tank — 360° View</h1>

<div class="viewer" id="viewer">

  <button class="arrow left" id="prev" aria-label="Previous">‹</button>

  <img id="spin"
       src="../frame-1.jpg"
       alt="Vintage Tank 360 View"
       draggable="false">

  <button class="arrow right" id="next" aria-label="Next">›</button>

</div>

<div class="controls">
  <button class="control" id="play">Auto Spin</button>
  <button class="control" id="reset">Reset</button>
</div>

<div class="hint">
  Drag left or right to rotate the tank
</div>

</div>

<script>

const frames = [
  "../frame-1.jpg",
  "../frame-2.jpg",
  "../frame-3.jpg",
  "../frame-4.jpg",
  "../frame-5.jpg",
  "../frame-6.jpg"
];

const viewer = document.getElementById("viewer");
const img = document.getElementById("spin");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const play = document.getElementById("play");
const reset = document.getElementById("reset");

let index = 0;
let dragging = false;
let startX = 0;
let lastX = 0;
let auto = null;

const images = [];

frames.forEach(src => {
  const image = new Image();
  image.src = src;
  images.push(image);
});

function showFrame() {
  img.src = frames[index];
}

function nextFrame() {
  index = (index + 1) % frames.length;
  showFrame();
}

function previousFrame() {
  index = (index - 1 + frames.length) % frames.length;
  showFrame();
}

prev.addEventListener("click", previousFrame);
next.addEventListener("click", nextFrame);

viewer.addEventListener("pointerdown", e => {
  dragging = true;
  startX = e.clientX;
  lastX = e.clientX;
  viewer.setPointerCapture(e.pointerId);
});

viewer.addEventListener("pointermove", e => {

  if (!dragging) return;

  const movement = e.clientX - lastX;

  if (Math.abs(movement) >= 15) {

    if (movement < 0) {
      nextFrame();
    } else {
      previousFrame();
    }

    lastX = e.clientX;
  }
});

viewer.addEventListener("pointerup", () => {
  dragging = false;
});

viewer.addEventListener("pointercancel", () => {
  dragging = false;
});

play.addEventListener("click", () => {

  if (auto) {
    clearInterval(auto);
    auto = null;
    play.textContent = "Auto Spin";
  } else {

    auto = setInterval(() => {
      nextFrame();
    }, 500);

    play.textContent = "Stop Spin";
  }

});

reset.addEventListener("click", () => {

  if (auto) {
    clearInterval(auto);
    auto = null;
    play.textContent = "Auto Spin";
  }

  index = 0;
  showFrame();

});

showFrame();

</script>

</body>
</html>
