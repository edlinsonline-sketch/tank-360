<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot 175924 — Interactive View</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#222}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
h1{text-align:center;font-size:22px;margin:4px 0 14px}
.viewer{position:relative;width:100%;height:700px;background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center}
.viewer.dragging{cursor:grabbing}
.viewer img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.65);color:#fff;width:44px;height:44px;border-radius:50%;font-size:28px;z-index:2;cursor:pointer}
.arrow.left{left:12px}.arrow.right{right:12px}
.controls{display:flex;justify-content:center;gap:8px;margin-top:12px}
button.ctrl{border:1px solid #bbb;background:#fff;padding:9px 14px;border-radius:7px;cursor:pointer}
.note{text-align:center;font-size:13px;color:#666;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Lot 175924 — Interactive View</h1>
<div class="viewer" id="viewer">
<button class="arrow left" id="prev">‹</button>
<img id="spin" src="1.jpg" alt="Lot 175924">
<button class="arrow right" id="next">›</button>
</div>
<div class="controls">
<button class="ctrl" id="play">Auto View</button>
<button class="ctrl" id="reset">↻ Reset</button>
</div>
<div class="note">Two supplied views are shown. No additional views have been invented.</div>
</div>
<script>
const frames=["1.jpg","2.jpg"];
const viewer=document.getElementById("viewer");
const img=document.getElementById("spin");
let index=0,dragging=false,lastX=0,auto=null;
function showFrame(){img.src=frames[index]}
function nextFrame(){index=(index+1)%frames.length;showFrame()}
function prevFrame(){index=(index-1+frames.length)%frames.length;showFrame()}
document.getElementById("next").onclick=nextFrame;
document.getElementById("prev").onclick=prevFrame;
document.getElementById("reset").onclick=()=>{index=0;showFrame()};
viewer.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;viewer.classList.add("dragging");viewer.setPointerCapture(e.pointerId)});
viewer.addEventListener("pointermove",e=>{if(!dragging)return;let m=e.clientX-lastX;if(Math.abs(m)>10){m<0?nextFrame():prevFrame();lastX=e.clientX}});
viewer.addEventListener("pointerup",()=>{dragging=false;viewer.classList.remove("dragging")});
viewer.addEventListener("pointercancel",()=>{dragging=false;viewer.classList.remove("dragging")});
document.getElementById("play").onclick=()=>{
if(auto){clearInterval(auto);auto=null;document.getElementById("play").textContent="Auto View"}
else{auto=setInterval(nextFrame,900);document.getElementById("play").textContent="Stop"}
};
showFrame();
</script>
</body>
</html>
