<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot 178699 — Interactive View</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial;color:#222}
.wrap{max-width:1000px;margin:auto;padding:18px}h1{text-align:center;font-size:22px}
.viewer{position:relative;height:700px;border:1px solid #ddd;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.viewer img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.65);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:28px}
.left{left:12px}.right{right:12px}.controls{text-align:center;margin-top:12px}
button.ctrl{padding:9px 14px;margin:4px;background:#fff;border:1px solid #bbb;border-radius:7px}
.note{text-align:center;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="wrap"><h1>Lot 178699 — Interactive View</h1>
<div class="viewer" id="viewer"><button class="arrow left" id="prev">‹</button><img id="spin" src="1.jpg" alt="Lot 178699"><button class="arrow right" id="next">›</button></div>
<div class="controls"><button class="ctrl" id="play">Auto View</button><button class="ctrl" id="reset">↻ Reset</button></div>
<div class="note">Two supplied views are shown. No additional views have been invented.</div></div>
<script>
const f=["1.jpg","2.jpg"];let i=0,d=false,x=0,t=null;
function s(){spin.src=f[i]}function n(){i=(i+1)%f.length;s()}function p(){i=(i-1+f.length)%f.length;s()}
next.onclick=n;prev.onclick=p;reset.onclick=()=>{i=0;s()};
viewer.onpointerdown=e=>{d=true;x=e.clientX;viewer.setPointerCapture(e.pointerId)};
viewer.onpointermove=e=>{if(!d)return;let m=e.clientX-x;if(Math.abs(m)>10){m<0?n():p();x=e.clientX}};
viewer.onpointerup=()=>d=false;
play.onclick=()=>{if(t){clearInterval(t);t=null;play.textContent="Auto View"}else{t=setInterval(n,900);play.textContent="Stop"}};
s();
</script>
</body>
</html>
